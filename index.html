            function getInputValue(input) {
                var value = input.value.trim();
                if (input.disabled && input.getAttribute("data-auto-value") === "0" && value === "0") {
                    return 0;
                }
                return /^[1-5]$/.test(value) ? Number(value) : null;
            }

            function getScoredValue(input) {
                var value = getInputValue(input);
                if (value === null) { return null; }
                return value;
            }

            function setInputError(input, message) {
                var error = document.getElementById(input.id + "-error");
                input.classList.add("is-invalid");
                input.setAttribute("aria-invalid", "true");
                if (error) { error.textContent = message; }
            }

            function clearInputError(input) {
                var error = document.getElementById(input.id + "-error");
                input.classList.remove("is-invalid");
                input.removeAttribute("aria-invalid");
                if (error) { error.textContent = ""; }
            }

            function getQuestionRow(input) {
                return input && input.closest ? input.closest(".ctest-question") : null;
            }

            function setActiveQuestion(input) {
                app.querySelectorAll(".ctest-question.is-active").forEach(function (row) {
                    row.classList.remove("is-active");
                });
                var row = getQuestionRow(input);
                if (row) { row.classList.add("is-active"); }
            }

            function clearActiveQuestion(input) {
                var row = getQuestionRow(input);
                if (row) { row.classList.remove("is-active"); }
            }

            function validateInput(input, showMissing) {
                if (input.disabled && input.getAttribute("data-auto-value") === "0" && input.value.trim() === "0") {
                    clearInputError(input);
                    return true;
                }
                if (input.disabled && input.value.trim() === "") { return false; }
                var value = input.value.trim();
                if (value === "") {
                    if (showMissing) {
                        setInputError(input, "Заполните поле цифрой от 1 до 5.");
                    } else {
                        clearInputError(input);
                    }
                    return false;
                }
                if (!/^[1-5]$/.test(value)) {
                    setInputError(input, "Можно ввести только цифру 1, 2, 3, 4 или 5.");
                    return false;
                }
                clearInputError(input);
                return true;
            }

            function isSexSelected() {
                return selectedSex === "female" || selectedSex === "male";
            }

            function setSexSelection(sex) {
                selectedSex = sex === "female" || sex === "male" ? sex : "";
                app.querySelectorAll('input[name="ctest-sex"]').forEach(function (radio) {
                    radio.checked = radio.value === selectedSex;
                });
                applySexFieldState();
            }

            function syncSexFromAnswer(input) {
                var inputSex = input.getAttribute("data-sex");
                if (!inputSex || getInputValue(input) === null) { return; }
                setSexSelection(inputSex);
            }

            function applySexFieldState() {
                app.querySelectorAll(".ctest-answer").forEach(function (input) {
                    var inputSex = input.getAttribute("data-sex");
                    var row = getQuestionRow(input);
                    var shouldDisable = !isSexSelected() || (inputSex && inputSex !== selectedSex);
                    input.disabled = shouldDisable;
                    input.setAttribute("aria-disabled", String(shouldDisable));
                    if (!isSexSelected()) {
                        if (input.getAttribute("data-auto-value") === "0") {
                            input.value = "";
                        }
                        input.removeAttribute("data-auto-value");
                        clearInputError(input);
                    } else if (inputSex && inputSex !== selectedSex) {
                        input.value = "0";
                        input.setAttribute("data-auto-value", "0");
                        clearInputError(input);
                    } else {
                        if (input.getAttribute("data-auto-value") === "0") {
                            input.value = "";
                        }
                        input.removeAttribute("data-auto-value");
                    }
                    if (row) {
                        row.classList.toggle("is-disabled", shouldDisable);
                        row.classList.toggle("is-auto", shouldDisable && isSexSelected() && Boolean(inputSex));
                    }
                });
                var sexStatus = app.querySelector("[data-sex-status]");
                if (sexStatus) {
                    sexStatus.textContent = isSexSelected()
                        ? "Поля анкеты открыты. Неподходящий вопрос в блоке «Сырой жар» автоматически получает 0 и не добавляет баллы."
                        : "Выберите пол, чтобы открыть поля анкеты.";
                }
            }

            function computeTotals() {
                var totals = {};
                groups.forEach(function (group) {
                    totals[group.id] = {
                        id: group.id,
                        title: group.title,
                        shortTitle: group.shortTitle,
                        sheet: group.sheet,
                        count: group.questions.length,
                        total: 0,
                        rawTotal: 0,
                        max: 0,
                        min: 0,
                        answered: 0,
                        complete: false,
                        converted: 0
                    };
                });
                app.querySelectorAll(".ctest-answer").forEach(function (input) {
                    var groupId = input.getAttribute("data-group");
                    var value = getInputValue(input);
                    var scored = getScoredValue(input);
                    if (value === null || scored === null) { return; }
                    totals[groupId].rawTotal += value;
                    totals[groupId].total += scored;
                    totals[groupId].answered += 1;
                    if (!(input.disabled && input.getAttribute("data-auto-value") === "0")) {
                        totals[groupId].min += 1;
                        totals[groupId].max += 5;
                    }
                });
                Object.keys(totals).forEach(function (groupId) {
                    var item = totals[groupId];
                    var range = item.max - item.min;
                    item.complete = item.answered === item.count;
                    item.converted = item.complete && range > 0 ? Math.round(((item.total - item.min) / range) * 1000) / 10 : 0;
                });
                return totals;
            }

            function updateState() {
                var inputs = Array.prototype.slice.call(app.querySelectorAll(".ctest-answer"));
                var validCount = inputs.reduce(function (sum, input) {
                    return sum + (getInputValue(input) !== null ? 1 : 0);
                }, 0);
                var totals = computeTotals();
                var allFieldsValid = validCount === totalQuestionCount;
                var allValid = allFieldsValid && isSexSelected();
                var current = app.querySelector("[data-progress-current]");
                var meter = app.querySelector("[data-progress-meter]");
                var resultButton = app.querySelector("[data-result-button]");
                var status = app.querySelector("[data-form-status]");
                if (current) { current.textContent = validCount; }
                if (meter) { meter.value = validCount; }
                if (resultButton) { resultButton.disabled = !allValid; }
                if (status) {
                    status.textContent = !isSexSelected()
                        ? "Сначала выберите пол. После выбора откроются поля анкеты."
                        : allValid
                        ? "Все поля заполнены. Можно смотреть результат."
                        : "Заполните оставшиеся поля цифрами от 1 до 5. Если вопрос не относится к вам, поставьте 1.";
                }
                Object.keys(totals).forEach(function (groupId) {
                    var totalOutput = app.querySelector('[data-total-for="' + groupId + '"]');
                    var missingOutput = app.querySelector('[data-missing-for="' + groupId + '"]');
                    var card = app.querySelector('[data-group-card="' + groupId + '"]');
                    var item = totals[groupId];
                    var missing = item.count - item.answered;
                    if (totalOutput) { totalOutput.textContent = item.total; }
                    if (missingOutput) {
                        missingOutput.textContent = missing > 0 ? "Не заполнено: " + missing : "Заполнено";
                    }
                    if (card) { card.classList.toggle("is-complete", missing === 0); }
                });
                inputs.forEach(function (input) {
                    var row = getQuestionRow(input);
                    if (row) {
                        row.classList.toggle("has-value", getInputValue(input) !== null);
                    }
                });
            }

            function validateAll(showMissing) {
                var inputs = Array.prototype.slice.call(app.querySelectorAll(".ctest-answer"));
                var firstInvalid = null;
                var allValid = true;
                inputs.forEach(function (input) {
                    var valid = validateInput(input, showMissing);
                    if (!valid && !firstInvalid) { firstInvalid = input; }
                    allValid = allValid && valid;
                });
                return { allValid: allValid, firstInvalid: firstInvalid };
            }

            function getLevel(percent) {
                if (percent >= 75) { return "высокая выраженность"; }
                if (percent >= 50) { return "выраженная тенденция"; }
                if (percent >= 25) { return "умеренная тенденция"; }
                return "низкая выраженность";
            }

            function chooseLead(totals) {
                var list = groups.map(function (group) { return totals[group.id]; });
                var balanced = totals.balanced;
                var deviations = list
                    .filter(function (item) { return item.id !== "balanced"; })
                    .sort(function (a, b) { return b.converted - a.converted; });
                var topDeviation = deviations[0];
                if (balanced.converted >= 70 && topDeviation.converted < 45) {
                    return { lead: balanced, topDeviations: deviations.slice(0, 3), balanced: true };
                }
                return { lead: topDeviation, topDeviations: deviations.slice(0, 3), balanced: false };
            }

            function renderResultTable(totals) {
                return groups.map(function (group) {
                    var item = totals[group.id];
                    return [
                        "<tr>",
                        "<td>Лист " + item.sheet + "</td>",
                        "<td>" + escapeHtml(item.title) + "</td>",
                        "<td><strong>" + item.total + "</strong> из " + item.max + "</td>",
                        "<td>" + item.converted.toFixed(1).replace(".", ",") + "%</td>",
                        "</tr>"
                    ].join("");
                }).join("");
            }

            function buildResultMessage(totals, leadInfo) {
                var date = new Date().toLocaleString("ru-RU", {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                });
                var lines = [
                    "Тест конституционного типа FOHOW",
                    "Дата заполнения: " + date,
                    "",
                    "Итоговые баллы:",
                    "Лист 1:"
                ];
                groups.filter(function (group) { return group.sheet === 1; }).forEach(function (group) {
                    var item = totals[group.id];
                    lines.push("- " + item.title + ": " + item.total + " из " + item.max + " (" + item.converted.toFixed(1).replace(".", ",") + "%)");
                });
                lines.push("Лист 2:");
                groups.filter(function (group) { return group.sheet === 2; }).forEach(function (group) {
                    var item = totals[group.id];
                    lines.push("- " + item.title + ": " + item.total + " из " + item.max + " (" + item.converted.toFixed(1).replace(".", ",") + "%)");
                });
                lines.push("");
                lines.push("Ведущий результат: " + leadInfo.lead.title + " - " + leadInfo.lead.total + " из " + leadInfo.lead.max + " (" + leadInfo.lead.converted.toFixed(1).replace(".", ",") + "%).");
                lines.push("Прошу специалиста пояснить, что означает итоговый балл и какие шаги лучше обсудить.");
                return lines.join("\n");
            }

            function renderResults() {
                var totals = computeTotals();
                var leadInfo = chooseLead(totals);
                var leadGroup = groupById[leadInfo.lead.id];
                var result = app.querySelector("#constitutionTestResult");
                var title = app.querySelector("[data-result-title]");
                var summary = app.querySelector("[data-result-summary]");
                var table = app.querySelector("[data-result-table]");
                var top = app.querySelector("[data-result-top]");
                var message = app.querySelector("[data-result-message]");
                if (title) {
                    title.textContent = "Ведущий результат: " + leadInfo.lead.title;
                }
                if (summary) {
                    summary.textContent = leadInfo.balanced
                        ? "Высокий балл по нормальному типу и более низкие значения по остальным шкалам обычно указывают на более сбалансированную картину по этой анкете."
                        : leadGroup.leadText + " Используйте результат как ориентир для разговора со специалистом.";
                }
                if (table) { table.innerHTML = renderResultTable(totals); }
                if (top) {
                    top.innerHTML = leadInfo.topDeviations.map(function (item, index) {
                        return [
                            '<article class="ctest-top-card">',
                            "<span>" + (index + 1) + "</span>",
                            "<h4>" + escapeHtml(item.title) + "</h4>",
                            "<p>" + item.total + " из " + item.max + ", " + getLevel(item.converted) + "</p>",
                            "</article>"
                        ].join("");
                    }).join("");
                }
                if (message) {
                    message.value = buildResultMessage(totals, leadInfo);
                }
                if (result) {
                    result.hidden = false;
                    result.scrollIntoView({ behavior: "smooth", block: "start" });
                }
            }

            function scrollQuestionIntoView(input, behavior) {
                var row = getQuestionRow(input);
                if (!row) { return; }
                requestAnimationFrame(function () {
                    row.scrollIntoView({
                        behavior: behavior || "smooth",
                        block: "center",
                        inline: "nearest"
                    });
                });
            }

            function focusInput(input, behavior) {
                if (!input) { return; }
                try {
                    input.focus({ preventScroll: true });
                } catch (_) {
                    input.focus();
                }
                scrollQuestionIntoView(input, behavior);
            }

            function focusRelativeInput(currentInput, direction) {
                var inputs = Array.prototype.slice.call(app.querySelectorAll(".ctest-answer:not(:disabled)"));
                var index = inputs.indexOf(currentInput);
                var targetIndex = index + direction;
                if (index >= 0 && targetIndex >= 0 && targetIndex < inputs.length) {
                    focusInput(inputs[targetIndex]);
                }
            }

            function focusNextInput(currentInput) { focusRelativeInput(currentInput, 1); }
            function focusPreviousInput(currentInput) { focusRelativeInput(currentInput, -1); }

            function getCurrentTheme() {
                return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
            }

            function applyTheme(theme, save) {
                document.documentElement.setAttribute("data-theme", theme);
                if (save) {
                    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
                }
                updateThemeButton(theme);
            }

            function updateThemeButton(theme) {
                var btn = app.querySelector("[data-theme-toggle]");
                if (!btn) { return; }
                var icon = btn.querySelector("i");
                if (icon) {
                    icon.className = theme === "dark" ? "fas fa-sun" : "fas fa-moon";
                }
                btn.setAttribute("aria-label", theme === "dark" ? "Включить светлую тему" : "Включить тёмную тему");
                btn.setAttribute("title", theme === "dark" ? "Светлая тема" : "Тёмная тема");
            }

            function bindThemeToggle() {
                var btn = app.querySelector("[data-theme-toggle]");
                updateThemeButton(getCurrentTheme());
                if (!btn) { return; }
                btn.addEventListener("click", function () {
                    var next = getCurrentTheme() === "dark" ? "light" : "dark";
                    applyTheme(next, true);
                });
            }

            function bindEvents() {
                var form = app.querySelector("#constitutionTestForm");
                var resetButton = app.querySelector("[data-reset-button]");
                var copyButton = app.querySelector("[data-copy-result]");
                var copyStatus = app.querySelector("[data-copy-status]");

                app.querySelectorAll('input[name="ctest-sex"]').forEach(function (radio) {
                    radio.addEventListener("change", function () {
                        setSexSelection(radio.value);
                        updateState();
                        var firstInput = app.querySelector(".ctest-answer:not(:disabled)");
                        if (firstInput) { focusInput(firstInput); }
                    });
                });

                app.querySelectorAll(".ctest-answer").forEach(function (input) {
                    input.addEventListener("focus", function () {
                        setActiveQuestion(input);
                        scrollQuestionIntoView(input);
                    });
                    input.addEventListener("blur", function () {
                        clearActiveQuestion(input);
                    });
                    input.addEventListener("keydown", function (event) {
                        var key = event.key;
                        if (event.altKey && (key === "ArrowLeft" || key === "Left")) {
                            event.preventDefault();
                            focusPreviousInput(input);
                            return;
                        }
                        if (event.altKey && (key === "ArrowRight" || key === "Right")) {
                            event.preventDefault();
                            focusNextInput(input);
                            return;
                        }
                        if (key === "Enter") {
                            event.preventDefault();
                            focusNextInput(input);
                            return;
                        }
                        if (event.ctrlKey || event.metaKey || event.altKey) { return; }
                        if (key.length !== 1) { return; }
                        if (!/^[1-5]$/.test(key)) {
                            event.preventDefault();
                            setInputError(input, "Можно ввести только цифру 1, 2, 3, 4 или 5.");
                            return;
                        }
                        event.preventDefault();
                        input.value = key;
                        validateInput(input, submitted);
                        syncSexFromAnswer(input);
                        updateState();
                        focusNextInput(input);
                    });
                    input.addEventListener("paste", function (event) {
                        var text = (event.clipboardData || window.clipboardData).getData("text").trim();
                        event.preventDefault();
                        if (/^[1-5]$/.test(text.charAt(0))) {
                            input.value = text.charAt(0);
                            validateInput(input, submitted);
                            syncSexFromAnswer(input);
                            updateState();
                            focusNextInput(input);
                            return;
                        }
                        setInputError(input, "Вставьте одну цифру от 1 до 5.");
                        updateState();
                    });
                    input.addEventListener("input", function () {
                        var value = input.value.trim();
                        if (value.length > 1) { input.value = value.charAt(0); }
                        validateInput(input, submitted);
                        syncSexFromAnswer(input);
                        updateState();
                    });
                    input.addEventListener("blur", function () {
                        validateInput(input, submitted);
                        updateState();
                    });
                });

                form.addEventListener("submit", function (event) {
                    event.preventDefault();
                    submitted = true;

                    if (!isSexSelected()) {
                        var sexStatus = app.querySelector("[data-sex-status]");
                        var firstSex = app.querySelector('input[name="ctest-sex"]');
                        if (sexStatus) {
                            sexStatus.textContent = "Сначала выберите пол, затем заполните анкету.";
                        }
                        updateState();
                        if (firstSex) {
                            firstSex.focus();
                            firstSex.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
                        }
                        return;
                    }

                    var validation = validateAll(true);
                    updateState();

                    if (!validation.allValid) {
                        var status = app.querySelector("[data-form-status]");
                        if (status) {
                            status.textContent = "Проверьте подсвеченные поля: нужны только цифры от 1 до 5.";
                        }
                        if (validation.firstInvalid) { validation.firstInvalid.focus(); }
                        return;
                    }
                    renderResults();
                });

                resetButton.addEventListener("click", function () {
                    submitted = false;
                    setSexSelection("");
                    app.querySelectorAll(".ctest-answer").forEach(function (input) {
                        input.value = "";
                        clearInputError(input);
                    });
                    var result = app.querySelector("#constitutionTestResult");
                    if (result) { result.hidden = true; }
                    if (copyStatus) { copyStatus.textContent = ""; }
                    updateState();
                    var firstSex = app.querySelector('input[name="ctest-sex"]');
                    if (firstSex) { firstSex.focus(); }
                });

                copyButton.addEventListener("click", function () {
                    var message = app.querySelector("[data-result-message]");
                    if (!message || !message.value) { return; }
                    function done() {
                        if (copyStatus) {
                            copyStatus.textContent = "Итог скопирован. Откройте MAX и отправьте сообщение специалисту.";
                        }
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(message.value).then(done).catch(function () {
                            message.focus();
                            message.select();
                            document.execCommand("copy");
                            done();
                        });
                        return;
                    }
                    message.focus();
                    message.select();
                    document.execCommand("copy");
                    done();
                });
            }

            renderApp();
            bindThemeToggle();
            bindEvents();
            applySexFieldState();
            updateState();
        })();
    </script>
</body>
</html>
